services:
  - type: web
    name: playunpause-web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    disk:
      name: unpause-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/unpause.db
      - key: PUBLIC_SITE_URL
        value: https://playunpause.com
      - key: SUPPORT_EMAIL
        value: hello@playunpause.com
      - key: SPONSOR_EMAIL
        value: sponsors@playunpause.com
      - key: ALLOW_DEMO_UNLOCK
        value: "false"
      - key: TRUST_CF_HEADERS
        value: "true"
      - key: WHOP_PASS_PLAN_ID
        sync: false
      - key: WHOP_SPONSOR_PLAN_ID
        sync: false
      - key: WHOP_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_HASH_PEPPER
        sync: false
      - key: ADMIN_API_KEY
        sync: false
